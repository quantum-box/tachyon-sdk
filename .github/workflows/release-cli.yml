name: Release CLI

on:
  push:
    tags:
      - 'tachyon-cli-v*'

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.artifact }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: tachyon-linux-x86_64
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            artifact: tachyon-linux-arm64
          # Statically linked musl builds. The gnu artifacts above
          # are built on Ubuntu 24.04 and therefore require
          # GLIBC_2.39, which makes them unusable on older images
          # such as Amazon Linux 2023 (glibc 2.34) used by the
          # CodeBuild Cloud App runners. Keep both: the gnu
          # artifacts stay the default for developer installs,
          # while build runners consume the musl ones.
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            artifact: tachyon-linux-musl-x86_64
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            artifact: tachyon-linux-musl-arm64
          # macos-13 Intel queues indefinitely; use GitHub's
          # current standard Intel label instead.
          - os: macos-15-intel
            target: x86_64-apple-darwin
            artifact: tachyon-darwin-x86_64
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: tachyon-darwin-arm64

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # aws-lc-sys and ring compile C sources, so the musl targets
      # need a musl-aware C toolchain in addition to the Rust std.
      - name: Install musl build tools
        if: contains(matrix.target, '-musl')
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools

      - name: Build
        working-directory: cli
        run: cargo build --release --target ${{ matrix.target }}

      - name: Verify musl artifact is statically linked
        if: contains(matrix.target, '-musl')
        run: |
          BIN=cli/target/${{ matrix.target }}/release/tachyon
          file "$BIN"
          if ! file "$BIN" | grep -q 'statically linked'; then
            echo "ERROR: $BIN is not statically linked" >&2
            exit 1
          fi

      - name: Package
        shell: bash
        run: |
          BIN=cli/target/${{ matrix.target }}/release/tachyon
          mkdir -p dist
          tar -czf dist/${{ matrix.artifact }}.tar.gz -C "$(dirname "$BIN")" "$(basename "$BIN")"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.artifact }}.tar.gz

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create release and upload assets
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.tar.gz
          generate_release_notes: true
