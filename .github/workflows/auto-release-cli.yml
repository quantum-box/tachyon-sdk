name: Auto Release CLI

on:
  push:
    branches: [main]
    paths:
      - 'cli/**'
      # Also re-run when the release pipeline itself changes. A
      # failed release leaves the version bumped but the tag
      # missing, and without this a fix to this workflow would not
      # re-attempt it. The check job skips when the tag already
      # exists, so this stays idempotent.
      - '.github/workflows/auto-release-cli.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    name: Check if release needed
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      needed: ${{ steps.check_tag.outputs.needed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read version from Cargo.toml
        id: version
        run: |
          VERSION=$(grep -m1 '^version' cli/Cargo.toml | sed 's/.*"\(.*\)"/\1/')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=tachyon-cli-v$VERSION" >> "$GITHUB_OUTPUT"
          echo "Detected version: $VERSION"

      - name: Check if tag already exists
        id: check_tag
        run: |
          if git rev-parse "tachyon-cli-v${{ steps.version.outputs.version }}" >/dev/null 2>&1; then
            echo "needed=false" >> "$GITHUB_OUTPUT"
            echo "Tag tachyon-cli-v${{ steps.version.outputs.version }} already exists, skipping release"
          else
            echo "needed=true" >> "$GITHUB_OUTPUT"
            echo "Tag tachyon-cli-v${{ steps.version.outputs.version }} does not exist, will create release"
          fi

  build:
    name: Build ${{ matrix.artifact }}
    needs: check
    if: needs.check.outputs.needed == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: tachyon-linux-x86_64
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            artifact: tachyon-linux-arm64
          # Statically linked musl builds. The gnu artifacts above
          # are built on Ubuntu 24.04 and therefore require
          # GLIBC_2.39, which makes them unusable on older images
          # such as Amazon Linux 2023 (glibc 2.34) used by the
          # CodeBuild Cloud App runners. Keep both: the gnu
          # artifacts stay the default for developer installs,
          # while build runners consume the musl ones.
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            artifact: tachyon-linux-musl-x86_64
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            artifact: tachyon-linux-musl-arm64
          # macos-13 Intel queues indefinitely; use GitHub's
          # current standard Intel label instead.
          - os: macos-15-intel
            target: x86_64-apple-darwin
            artifact: tachyon-darwin-x86_64
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: tachyon-darwin-arm64

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # The step above installs the target for `stable`, but
      # cli/rust-toolchain.toml pins a specific channel, so that is
      # the toolchain cargo actually uses. Install the target there
      # too. Running inside cli/ makes rustup pick the pinned
      # toolchain. Host targets already ship their std, which is why
      # only the cross-libc musl targets failed with
      # `can't find crate for core`.
      - name: Install target for the pinned toolchain
        working-directory: cli
        run: rustup target add ${{ matrix.target }}

      # aws-lc-sys and ring compile C sources, so the musl targets
      # need a musl-aware C toolchain in addition to the Rust std.
      - name: Install musl build tools
        if: contains(matrix.target, '-musl')
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools

      - name: Build
        working-directory: cli
        run: cargo build --release --target ${{ matrix.target }}

      - name: Verify musl artifact is statically linked
        if: contains(matrix.target, '-musl')
        run: |
          BIN=cli/target/${{ matrix.target }}/release/tachyon
          file "$BIN"
          if ! file "$BIN" | grep -q 'statically linked'; then
            echo "ERROR: $BIN is not statically linked" >&2
            exit 1
          fi

      - name: Package
        shell: bash
        run: |
          BIN=cli/target/${{ matrix.target }}/release/tachyon
          mkdir -p dist
          tar -czf dist/${{ matrix.artifact }}.tar.gz -C "$(dirname "$BIN")" "$(basename "$BIN")"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.artifact }}.tar.gz

  release:
    name: Create GitHub Release
    needs: [check, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create release and upload assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ needs.check.outputs.tag }}" \
            dist/*.tar.gz \
            --title "${{ needs.check.outputs.tag }}" \
            --generate-notes
